name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check that tag, versions and changelog match
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          frontend=$(jq -r .version frontend/package.json)
          backend=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/__init__.py)
          if [ "$tag" != "$frontend" ] || [ "$tag" != "$backend" ]; then
            echo "::error::tag $tag, frontend/package.json $frontend, backend/app/__init__.py $backend"
            exit 1
          fi
          if ! grep -q "^## $tag " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## $tag …'"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "**Image:** \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo "**Digest:** \`${DIGEST}\`"
          } >> notes.md
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md "${flags[@]}"
