name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Migrations apply to an empty database and match the models
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start OIDC provider (Dex)
        # Host network: browser and backend both reach the issuer as http://localhost:5556/dex
        run: |
          docker run -d --name dex --network host \
            -v "$PWD/e2e/oidc/dex.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.46.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done
      - name: Start instances
        # 8000: passwords and OIDC. 8001: OIDC only, accounts created at the first sign-in.
        run: |
          oidc="-e OIDC_ISSUER=http://localhost:5556/dex -e OIDC_CLIENT_ID=pomale -e OIDC_CLIENT_SECRET=pomale-e2e-secret -e OIDC_LABEL=Dex"
          docker run -d --name app --network host -e PUBLIC_URL=http://localhost:8000 $oidc app:ci
          docker run -d --name app2 --network host -e PUBLIC_URL=http://localhost:8001 $oidc \
            -e PASSWORD_LOGIN=off -e OIDC_AUTO_CREATE=on app:ci \
            sh -c "alembic upgrade head && exec uvicorn app.web:application --host 0.0.0.0 --port 8001"
          for port in 8000 8001; do
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/api/health" && break
              sleep 1
            done
          done
          for pair in app:E2E_SETUP_TOKEN app2:E2E_SETUP_TOKEN_2; do
            token=$(docker logs "${pair%%:*}" 2>&1 | grep -E '^    [A-Za-z0-9_-]{20,}$' | tail -1 | tr -d ' ')
            test -n "$token"
            echo "::add-mask::$token"
            echo "${pair#*:}=$token" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_BASE_URL_2: http://localhost:8001
          E2E_OIDC: "1"
        run: npx playwright test
      - name: Server log
        if: failure()
        run: |
          docker logs app
          echo "--- OIDC-only instance"
          docker logs app2
          echo "--- Dex"
          docker logs dex
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  private-terms:
    # Guards against personal data (domains, names, hosts) slipping into the repository.
    # The terms live in the PRIVATE_TERMS secret (one per line), never in the repo.
    # Forks and pull requests from forks have no access to it and skip the check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Search tracked files for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "PRIVATE_TERMS not available, skipping"
            exit 0
          fi
          printf '%s\n' "$PRIVATE_TERMS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/terms"
          if git grep -n -i -w -F -f "$RUNNER_TEMP/terms" -- . ; then
            echo "::error::Private terms found in tracked files (see above)"
            exit 1
          fi
          echo "No private terms found"
