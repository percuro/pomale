name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these checks before it builds and pushes an image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Migrations apply to an empty database and match the models
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Size budget
        run: npm run check:bundle

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start OIDC provider (Dex)
        # Host network: browser and backend both reach the issuer as http://localhost:5556/dex
        run: |
          docker run -d --name dex --network host \
            -v "$PWD/e2e/oidc/dex.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.46.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done
      - name: Start instances
        # 8000: passwords and OIDC. 8001: OIDC only, accounts created at the first sign-in. 8002: DEMO_MODE.
        run: |
          oidc="-e OIDC_ISSUER=http://localhost:5556/dex -e OIDC_CLIENT_ID=pomale -e OIDC_CLIENT_SECRET=pomale-e2e-secret -e OIDC_LABEL=Dex"
          docker run -d --name app --network host -e PUBLIC_URL=http://localhost:8000 -e PUSH_ALLOWED_HOSTS=push.invalid $oidc app:ci
          docker run -d --name app2 --network host -e PUBLIC_URL=http://localhost:8001 $oidc \
            -e PASSWORD_LOGIN=off -e OIDC_AUTO_CREATE=on app:ci \
            sh -c "alembic upgrade head && exec uvicorn app.web:application --host 0.0.0.0 --port 8001"
          docker run -d --name app3 --network host -e PUBLIC_URL=http://localhost:8002 -e DEMO_MODE=true app:ci \
            sh -c "alembic upgrade head && exec uvicorn app.web:application --host 0.0.0.0 --port 8002"
          for port in 8000 8001 8002; do
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/api/health" && break
              sleep 1
            done
          done
          for pair in app:E2E_SETUP_TOKEN app2:E2E_SETUP_TOKEN_2; do
            token=$(docker logs "${pair%%:*}" 2>&1 | grep -E '^    [A-Za-z0-9_-]{20,}$' | tail -1 | tr -d ' ')
            test -n "$token"
            echo "::add-mask::$token"
            echo "${pair#*:}=$token" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_BASE_URL_2: http://localhost:8001
          E2E_BASE_URL_3: http://localhost:8002
          E2E_OIDC: "1"
        run: npx playwright test
      - name: Back up and restore the instance the tests used
        # The built-in backup of the real image, restored into a new file: same rows in every table
        run: |
          docker exec app python -m app.cli.backup
          file=$(docker exec app sh -c 'ls -t /data/backups/pomale-*.sql.gz | head -1')
          docker exec app python -m app.cli.restore_sql --from "$file" --target /tmp/restored.db
          docker exec -i app python - <<'PY'
          import sqlite3

          live = sqlite3.connect("file:/data/habits.db?mode=ro", uri=True)
          restored = sqlite3.connect("/tmp/restored.db")
          query = "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%'"
          counts = {
              table: (
                  live.execute(f'SELECT count(*) FROM "{table}"').fetchone()[0],
                  restored.execute(f'SELECT count(*) FROM "{table}"').fetchone()[0],
              )
              for (table,) in live.execute(query)
          }
          print(counts)
          assert all(a == b for a, b in counts.values()), "row counts differ"
          assert counts["habits"][0] > 0 and counts["checkins"][0] > 0, "nothing to compare"
          PY
      - name: Server log
        if: failure()
        run: |
          docker logs app
          echo "--- OIDC-only instance"
          docker logs app2
          echo "--- Demo instance"
          docker logs app3
          echo "--- Dex"
          docker logs dex
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  upgrade:
    # A real update: an earlier release gets data, then this image starts on the same volume
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest public release, the first stable one and the newest one before this commit
        from: ["0.3.0", "1.0.0", latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
      - name: Upgrade from an earlier release
        env:
          FROM: ${{ matrix.from }}
        run: |
          if [ "$FROM" = latest ]; then
            # Tags on this commit are the release being built, which has no image yet
            FROM=$(git tag --list 'v[0-9]*' --no-contains HEAD | grep -v -e - | sed 's/^v//' | sort -V | tail -1)
          fi
          test -n "$FROM"
          echo "Upgrading from $FROM"
          e2e/upgrade/run.sh "ghcr.io/percuro/pomale:$FROM" app:ci

  private-terms:
    # Guards against personal data (domains, names, hosts) slipping into the repository.
    # The terms live in the PRIVATE_TERMS secret (one per line), never in the repo.
    # Forks and pull requests from forks have no access to it and skip the check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Search tracked files for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "PRIVATE_TERMS not available, skipping"
            exit 0
          fi
          printf '%s\n' "$PRIVATE_TERMS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/terms"
          if git grep -n -i -w -F -f "$RUNNER_TEMP/terms" -- . ; then
            echo "::error::Private terms found in tracked files (see above)"
            exit 1
          fi
          echo "No private terms found"
